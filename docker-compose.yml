services:

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: ai_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/vector_db:/app/vector_db

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: ai_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend