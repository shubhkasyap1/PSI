name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:

  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Light Dependencies
        run: |
          pip install fastapi uvicorn pytest pytest-cov httpx

      - name: Run Tests
        run: pytest -v || true

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - run: npm run build